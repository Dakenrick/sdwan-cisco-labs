system
 host-name               vBond-01
 system-ip               1.1.1.3
 site-id                 1000
 organization-name       DSA-LAB
 clock timezone America/New_York
 vbond 10.10.10.30 local
!
vpn 0
 no interface eth0
 interface ge0/0
  description CONTROLLER_TRANSPORT_LEAF_VLAN10
  ip address 10.10.10.30/24
  tunnel-interface
   encapsulation ipsec
   allow-service all
  !
  no shutdown
 !
 ip route 0.0.0.0/0 10.10.10.1
!
vpn 512
 interface eth0
  description OOB_MGMT_CLOUD1
  ip address 192.168.100.28/24
  no shutdown
 !
 ip route 0.0.0.0/0 192.168.100.1
!
