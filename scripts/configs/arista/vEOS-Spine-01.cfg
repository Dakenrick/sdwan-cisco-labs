! device: vEOS-Spine-01
! generated by build_arista_configs.py (TSK-05)
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname vEOS-Spine-01
!
spanning-tree mode mstp
!
no aaa root
username admin privilege 15 role network-admin secret admin
!
vrf instance MGMT
!
interface Management1
   description OOB_Management
   vrf MGMT
   ip address 192.168.100.20/24
!
ip route vrf MGMT 0.0.0.0/0 192.168.100.1
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
!
management ssh
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description P2P_vEOS-Leaf-01_Ethernet3
   no switchport
   mtu 9214
   ip address 10.0.1.0/31
!
interface Ethernet2
   description P2P_vEOS-Leaf-02_Ethernet3
   no switchport
   mtu 9214
   ip address 10.0.1.4/31
!
interface Ethernet10
   description RESERVED_SPINE_INTERLINK_unused_in_EVPN
   shutdown
!
interface Ethernet11
   description RESERVED_SPINE_INTERLINK_unused_in_EVPN
   shutdown
!
interface Loopback0
   description ROUTER_ID_EVPN
   ip address 10.0.250.1/32
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS
   seq 10 permit 10.0.250.0/24 eq 32
   seq 20 permit 10.0.255.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS
!
router bgp 65100
   router-id 10.0.250.1
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   neighbor UNDERLAY peer group
   neighbor UNDERLAY remote-as 65101
   neighbor UNDERLAY send-community
   neighbor UNDERLAY maximum-routes 12000
   neighbor EVPN-OVERLAY peer group
   neighbor EVPN-OVERLAY remote-as 65101
   neighbor EVPN-OVERLAY next-hop-unchanged
   neighbor EVPN-OVERLAY update-source Loopback0
   neighbor EVPN-OVERLAY bfd
   neighbor EVPN-OVERLAY ebgp-multihop 3
   neighbor EVPN-OVERLAY send-community
   neighbor EVPN-OVERLAY maximum-routes 0
   neighbor 10.0.1.1 peer group UNDERLAY
   neighbor 10.0.1.1 description vEOS-Leaf-01_underlay
   neighbor 10.0.1.5 peer group UNDERLAY
   neighbor 10.0.1.5 description vEOS-Leaf-02_underlay
   neighbor 10.0.250.11 peer group EVPN-OVERLAY
   neighbor 10.0.250.11 description vEOS-Leaf-01_evpn
   neighbor 10.0.250.12 peer group EVPN-OVERLAY
   neighbor 10.0.250.12 description vEOS-Leaf-02_evpn
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY activate
   !
   address-family ipv4
      neighbor UNDERLAY activate
!
end
