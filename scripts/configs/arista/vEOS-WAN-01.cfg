! device: vEOS-WAN-01
! generated by build_arista_configs.py (TSK-05)
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname vEOS-WAN-01
!
spanning-tree mode mstp
!
no aaa root
username admin privilege 15 role network-admin secret admin
!
vrf instance MGMT
!
interface Management1
   description OOB_Management
   vrf MGMT
   ip address 192.168.100.24/24
!
ip route vrf MGMT 0.0.0.0/0 192.168.100.1
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
!
management ssh
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description P2P_vEOS-Leaf-01_Eth5_DC_CONTROLLERS
   no switchport
   mtu 1500
   ip address 10.0.2.1/31
!
interface Ethernet2
   description c8000v-Hub-01_Gi1_MPLS
   no switchport
   mtu 1500
   ip address 172.16.1.1/30
!
interface Ethernet3
   description PROVIDER_MPLS_PE_BRANCH_SEGMENT
   no switchport
   ip address 172.16.100.2/24
   vrrp 1 priority-level 110
   vrrp 1 ipv4 172.16.100.1
!
interface Ethernet6
   description P2P_vEOS-WAN-02_Eth6_iBGP
   no switchport
   mtu 1500
   ip address 172.16.0.0/31
!
