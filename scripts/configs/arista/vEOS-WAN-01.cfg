   no bgp default ipv4-unicast
   maximum-paths 2
   neighbor 10.0.2.0 remote-as 65101
   neighbor 10.0.2.0 description vEOS-Leaf-01_VRF_WAN_controllers
   neighbor 10.0.2.0 send-community
   neighbor 172.16.0.1 remote-as 65000
   neighbor 172.16.0.1 description vEOS-WAN-02_iBGP
   neighbor 172.16.0.1 next-hop-self
   neighbor 172.16.0.1 send-community
   redistribute connected
   !
   address-family ipv4
      neighbor 10.0.2.0 activate
      neighbor 172.16.0.1 activate
!
end
